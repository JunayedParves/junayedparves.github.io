<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | M K Junayed Parves</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1220">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <!--
    GitHub Pages shows this page for any address that doesn't exist.
    It can be opened from any folder depth, so links and styles use
    absolute paths ("/css/…"). If your site ever moves to a sub-folder
    (e.g. username.github.io/portfolio/), change "/" to "/portfolio/".
  -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .notfound { min-height: 100vh; display: grid; align-items: center; padding: 64px 0; position: relative; overflow: hidden; }
    .notfound::before { content: ""; position: absolute; inset: 0; background: radial-gradient(640px 380px at 75% 40%, rgba(57, 189, 248, 0.14), transparent 65%); pointer-events: none; }
    .notfound .container { position: relative; }
    .notfound-code { font-family: var(--font-mono); font-size: clamp(72px, 14vw, 140px); font-weight: 500; line-height: 1; color: var(--accent); letter-spacing: -0.04em; }
    .notfound h1 { margin-top: 12px; font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.03em; }
    .notfound p { margin-top: 12px; max-width: 520px; font-size: 17px; color: var(--text-2); }
    .notfound .btn-row { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="container">
      <p class="eyebrow">Error 404</p>
      <p class="notfound-code" aria-hidden="true">404</p>
      <h1>This page took a wrong turn in the data.</h1>
      <p>The link may be old or mistyped. The portfolio, case studies and résumé are one click away.</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="/">Back to the homepage</a>
        <a class="btn btn-outline" href="/projects/">Browse projects</a>
      </div>
    </div>
  </main>
</body>
</html>
